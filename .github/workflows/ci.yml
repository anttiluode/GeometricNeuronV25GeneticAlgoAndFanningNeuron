name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python evolving_axon.py --seeds 2 --generations 35 --output smoke_results.json
      - run: python fan_geometry.py --seeds 2 --generations 25 --output fan_smoke_results.json
      - run: python nested_fan.py --seeds 2 --cycles 8 --output nested_fan_smoke_results.json
      - run: python delayed_credit.py --seeds 2 --steps 360 --output delayed_credit_smoke_results.json
      - run: python mixed_credit.py --seeds 2 --steps 800 --output mixed_credit_smoke_results.json
      - run: python trace_timescales.py --seeds 1 --steps 250 --output trace_timescale_smoke_results.json
